<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Explore real NASA SPHEREx observations of any sky position as a time series." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>SPHERE TRACK</title>
    <meta name="color-scheme" content="dark light" />
    <script>
      // Set the theme before first paint (no flash). Keep in sync with src/theme.ts (THEME_KEY).
      (function () {
        var p; try { p = localStorage.getItem('spheretrack-theme') } catch (e) {}
        document.documentElement.dataset.theme = p === 'dark' || p === 'light' ? p
          : window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
